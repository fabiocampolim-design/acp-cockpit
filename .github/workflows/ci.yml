# .github/workflows/ci.yml
name: CI
on: [push, pull_request]
jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - run: python -m pip install pyflakes
      - run: python -m pyflakes acp_cockpit tools scripts tests docs
      - run: python tools/check_schema_drift.py
  test:
    needs: static
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "${{ matrix.python }}"}
      - run: python -m pip install -e . pytest pyflakes
      - run: python -m pyflakes acp_cockpit tools scripts tests docs
      - run: python -m pytest tests -v --ignore=tests/test_e2e_ui.py
  e2e:
    needs: static
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - run: python -m pip install -e . pytest playwright
      - run: python -m playwright install chromium --with-deps
      - run: python -m pytest tests/test_e2e_ui.py -v
