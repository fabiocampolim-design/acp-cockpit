# Agent profile: Claude Code over the claude-agent-acp adapter
# (npm @agentclientprotocol/claude-agent-acp; formerly @zed-industries/claude-code-acp,
# deprecated and frozen at 0.16.2 since 2026-03).
# Everything Claude-specific lives HERE, not in the engine.
id = "claude"
name = "Claude Code"
command = ["claude-agent-acp"]
install_hint = "npm install -g @agentclientprotocol/claude-agent-acp"
npm_package = "@agentclientprotocol/claude-agent-acp"

# Nested-session guard: the Claude SDK refuses to start when these are set.
env_scrub = ["CLAUDECODE", "CLAUDE_CODE_*"]

# Vendor `_meta` extensions the adapter is known to attach (surfaced in the
# record, never interpreted). claude-agent-acp 0.73 dropped the old
# `session/set_model` method: model choice is a standard config option now.
extensions = ["_claude/rateLimit", "_claude/origin", "claudeCode.promptQueueing"]

[env_set]

# The adapter ships its own copy of the Claude CLI inside the Agent SDK it pins
# (2.1.44 in the deprecated 0.16.2; 2.1.257 in 0.73.0) and the API refuses old
# CLIs for new models ("version 2.1.251 or
# newer is required", 2026-09-01). When a `claude` is installed on PATH the
# adapter is pointed at it instead. Resolved AFTER the scrub above, which
# would strip an inherited CLAUDE_CODE_EXECUTABLE; an explicit [env_set]
# value wins; no `claude` on PATH leaves the adapter's bundled copy in use.
[env_resolve]
CLAUDE_CODE_EXECUTABLE = "claude"

[[caveats]]
id = "shell-escapes-boundary"
text = "The project-directory boundary is enforced only for file access routed through this client. Shell commands run by the agent itself are not confined; the approval dialog flags out-of-boundary paths and your answer is the only control. 'Always Allow' is a standing grant for the whole session."

[[caveats]]
id = "thinking-redacted"
text = "Thinking may arrive as empty markers (content redacted by the adapter, observed with claude-code-acp 0.16); the view then shows that thinking happened, not its text."

[[caveats]]
id = "slash-commands-on-stderr"
text = "Adapter diagnostics (one `[session/query] ...` line per session) and some built-in slash-command output arrive on the adapter's stderr; they appear as collapsible rows, not as anomalies."

[[caveats]]
id = "bundled-cli"
text = "The adapter bundles its own Claude CLI, which the API may refuse for newer models. When `claude` is installed on PATH this client points the adapter at it instead (CLAUDE_CODE_EXECUTABLE, shown below as runtime)."

[[caveats]]
id = "no-prompt-suggestions"
text = "Claude Code's predicted next-prompt suggestions do not cross ACP yet: the adapter neither enables the SDK's promptSuggestions option nor forwards the prompt_suggestion message (claude-agent-acp 0.73)."

[[caveats]]
id = "terminal-unadvertised"
text = "This client does not advertise the terminal capability in v1; the agent runs commands through its own executor instead. Nothing is lost, output arrives as tool calls."
