# Agent profile: Claude Code over the claude-agent-acp adapter
# (npm @agentclientprotocol/claude-agent-acp; formerly @zed-industries/claude-code-acp,
# deprecated and frozen at 0.16.2 since 2026-03).
# Everything Claude-specific lives HERE, not in the engine.
id = "claude"
name = "Claude Code"
command = ["claude-agent-acp"]
install_hint = "npm install -g @agentclientprotocol/claude-agent-acp"
npm_package = "@agentclientprotocol/claude-agent-acp"

# Nested-session guard: the Claude SDK refuses to start when these are set.
env_scrub = ["CLAUDECODE", "CLAUDE_CODE_*"]

# Vendor `_meta` extensions the adapter is known to attach (surfaced in the
# record, never interpreted). claude-agent-acp 0.73 dropped the old
# `session/set_model` method: model choice is a standard config option now.
extensions = ["_claude/rateLimit", "_claude/origin", "claudeCode.promptQueueing"]

[env_set]

# Session options the adapter merges into its Agent SDK call
# (`_meta.claudeCode.options`, claude-agent-acp 0.73). Recent models never
# return raw thinking text over the API - "summarized" is the most the
# client can be given, and without this the thought chunks arrive empty.
[client_options.thinking]
type = "adaptive"
display = "summarized"

# The adapter ships its own copy of the Claude CLI inside the Agent SDK it pins
# (2.1.44 in the deprecated 0.16.2; 2.1.257 in 0.73.0) and the API refuses old
# CLIs for new models ("version 2.1.251 or
# newer is required", 2026-09-01). When a `claude` is installed on PATH the
# adapter is pointed at it instead. Resolved AFTER the scrub above, which
# would strip an inherited CLAUDE_CODE_EXECUTABLE; an explicit [env_set]
# value wins; no `claude` on PATH leaves the adapter's bundled copy in use.
[env_resolve]
CLAUDE_CODE_EXECUTABLE = "claude"

# Approving a plan makes the CLI leave plan mode by itself, but the adapter
# sends no current_mode_update (0.73, observed 2026-09-01): the strip kept
# saying "Plan" while the agent was in default/auto mode. Re-assert the mode
# each answer implies (the agent echoes it back as a mode update).
[[permission_mode_followups]]
option_id = "exit-plan-default"
mode = "default"
[[permission_mode_followups]]
option_id = "exit-plan-auto"
mode = "auto"
[[permission_mode_followups]]
option_id = "exit-plan-clear-auto"
mode = "auto"

[[caveats]]
id = "shell-escapes-boundary"
text = "The project-directory boundary is enforced only for file access routed through this client. Shell commands run by the agent itself are not confined; the approval dialog flags out-of-boundary paths and your answer is the only control. 'Always Allow' is a standing grant for the whole session."

[[caveats]]
id = "thinking-summary"
text = "Thinking arrives as the model's own summary of its reasoning, not the raw text: the API returns summarized thinking or nothing at all for recent models. This client asks for the summaries (client_options.thinking); a turn that shows only a thinking marker had none to send."

[[caveats]]
id = "slash-commands-on-stderr"
text = "Adapter diagnostics (one `[session/query] ...` line per session) and some built-in slash-command output arrive on the adapter's stderr; they appear as collapsible rows, not as anomalies."

[[caveats]]
id = "bundled-cli"
text = "The adapter bundles its own Claude CLI, which the API may refuse for newer models. When `claude` is installed on PATH this client points the adapter at it instead (CLAUDE_CODE_EXECUTABLE, shown below as runtime)."

[[caveats]]
id = "terminal-only-prompts"
text = "Two things the Claude Code terminal shows you never cross ACP, because they are drawn by the CLI itself and are not protocol messages at all: the occasional session-quality survey (\"How is Claude doing in this session?\" - a `feedbackSurveyRate` setting, with no message type behind it) and its data-usage notices. No ACP client can relay them; the 40 SDK message types include nothing for either. Help (?) answers the privacy one directly."

[[caveats]]
id = "no-prompt-suggestions"
text = "Claude Code's predicted next-prompt suggestions do not cross ACP yet: the adapter neither enables the SDK's promptSuggestions option nor forwards the prompt_suggestion message (claude-agent-acp 0.73)."

[[caveats]]
id = "ask-question-preview"
text = "The agent's multiple-choice questions arrive as a form (AskUserQuestion over ACP elicitation): pick an option, type your own answer in \"Other\", or Skip. An option's preview (the mockup or snippet the terminal shows on focus) travels in a vendor _meta field and is not displayed here; its title and description are."

[[caveats]]
id = "plan-exit-mode"
text = "After you approve a plan the agent changes its own permission mode without announcing it; this client re-asserts the mode your answer implies (manual approval -> Manual, auto -> Auto) so the strip stays truthful."

[[caveats]]
id = "terminal-unadvertised"
text = "This client does not advertise the terminal capability in v1; the agent runs commands through its own executor instead. Nothing is lost, output arrives as tool calls."

# The adapter offers the models in its own order (default, sonnet, fable,
# opus, haiku in 0.73). Offer them by decreasing capability instead — matched
# as substrings of the value or the name, so a versioned id like
# `claude-fable-5-1[1m]` keeps working when the version moves.
[config_option_order]
model = ["default", "fable", "opus", "sonnet", "haiku"]
