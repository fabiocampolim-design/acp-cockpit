[project]
name = "claudiu"
version = "0.2.0"
description = "Browser client for AI coding agents over the Agent Client Protocol"
requires-python = ">=3.11"
dependencies = ["tornado>=6.4"]

[project.optional-dependencies]
dev = ["pytest", "pyflakes", "playwright"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["claudiu*"]

[tool.pytest.ini_options]
# archive/claudiu-v0.1 is a separate, gitignored repo with its own suite;
# a bare `pytest` from the root must not collect it (11 import errors).
testpaths = ["tests"]
